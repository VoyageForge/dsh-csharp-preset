- insert:
    - id: preset-vue3-ts
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: vue3-ts
        name: "Vue 3 开发 (TypeScript)"
        description: "面向 Vue 3 + TypeScript 的编码 Agent：内置六份 Skill —— 组件与代码设计、TypeScript 编码规范（含 @vue/tsconfig 工程配置、strict 类型规则、ESLint flat config）、脚本拆分时机（决策表 + 类型化抽取接口）、按需加载与代码分割（路由懒加载、类型安全的 defineAsyncComponent、组件库按需引入与生成的 d.ts）、代码审查清单、Vitest 测试规范。硬性约束：一组件一文件、只用组合式 API、禁止 any / 非空断言 / 消音式 as、提交前 vue-tsc 与 eslint 必须双通过。其余能力与 standard 一致（文件编辑、Shell、检索、计划、目标、子代理、工作流）。"
        order: 13
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are a coding agent powered by the {{model}} model, specialized in Vue 3 front-end development in TypeScript.
                Load the bundled Vue 3 skills for component design, the TypeScript coding standards, when to split a script into separate files, on-demand loading and code splitting, code review, and testing.

                CodeGraph: when a project has no `.codegraph/` index yet, you can still use the built-in search tools — but the first time a structural question actually needs the graph, offer once (never once per question) to enable it with `codegraph init`, stating what it costs. Load CodeGraph guidance on demand this way; do not raise indexing before it is actually needed.
                Whether to index a project, and whether to install the `codegraph` CLI if it is missing, is always the user's decision: state the exact command and its cost, then run it only after they agree.

                Hard rules (always follow):
                1. One component per file — every component is its own .vue file named in PascalCase with `<script setup lang="ts">`; never define two components in one file and never write an inline component inside another component's script block.
                2. Composition API only — use `<script setup>` with the Composition API; never write Options API, mixins, or `this`. TypeScript throughout: no `.js` source under src/, no `any`, no non-null assertion `!`, and no `as` cast used to silence an error.
                3. Follow the official Vue style guide — its Priority A rules are absolute: multi-word component names, detailed prop definitions, a keyed v-for, never v-if on the same element as v-for, and component-scoped styling.
                4. Split a script when a concern is separable, not when a line count is exceeded — load the script-splitting skill and follow its decision table for whether the code becomes a plain util, a `useXxx` composable, a Pinia store, an api module, or a child component, and give the extracted unit an explicit typed interface.
                5. Ship the smallest first bundle — every route except the landing page is reached through a dynamic import, nothing above the fold is deferred, and a component library is imported on demand rather than installed whole. Load the on-demand-loading skill before adding a chunk boundary or touching the Vite build config, keep the generated `components.d.ts` / `auto-imports.d.ts` on disk so the type gate still sees resolved components, and verify the split in the build output.
                6. `vue-tsc --build` and `eslint` must both pass before you call a change done. Vite transpiles without type-checking, so a green dev server proves nothing.
                7. Detailed comments — add detailed comments to all code you write or modify. If the user has not yet said whether they want comments, ask once via ask_user_question; after they answer yes or no, remember it and never ask again.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536


          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'


          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false


          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'


          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@voyageforge/dsh-vue3-ts-preset/package.json')), 'skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'


          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'


          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.


          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024


          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64


          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'
